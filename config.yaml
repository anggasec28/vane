# Hermes-native profile settings.
# Configure the model and provider with: hermes -p vane setup
# VANE engine policy lives separately in config/vane.example.json.
skills:
  auto_load:
    - adaptive-recovery
    - assessment-orchestrator
    - asset-surface-mapping
    - authorization-scope
    - data-lifecycle
    - evidence-management
    - finding-governance
    - independent-validation
    - mcp-tool-governance
    - project-case-operations
    - security-evidence-integrity
    - web2-assessment
    - web3-assessment

mcp_servers:
  vane_engine:
    command: "${HERMES_HOME}/.venv/bin/python"
    args: ["-m", "vane.mcp.server"]
    env:
      VANE_APPROVAL_KEYRING: "${HERMES_HOME}/config/approval-public-keys.json"
      VANE_DB_PATH: "${HERMES_HOME}/data/vane.sqlite3"
    enabled: true
    timeout: 30
    connect_timeout: 15
    tools:
      include:
        - vane_status
        - vane_scope_check
        - vane_verify_mission_approval
        - vane_verify_action_approval
        - vane_verify_closure_approval
        - vane_observe_dns_records
        - vane_observe_tls_metadata
        - vane_observe_http_metadata
        - vane_plan_web2
        - vane_plan_web3
        - vane_build_assessment_plan
        - vane_validate_evidence
        - vane_validate_finding
        - vane_validate_mission_closure
        - vane_plan_recovery
        - vane_lifecycle_decision
        - vane_verify_event_chain
        - vane_verify_project_integrity
        - vane_list_specialists
        - vane_delegate_worker_task
        - vane_complete_worker_task
        - vane_revoke_worker_task
        - vane_list_worker_tasks
        - vane_build_mission_report
        - vane_validate_remediation_plan
        - vane_save_case_work_item
        - vane_list_case_work_items
        - vane_save_case_timeline_event
        - vane_list_case_timeline
        - vane_save_threat_intel
        - vane_list_threat_intel
        - vane_save_remediation_action
        - vane_list_remediation_actions
        - vane_review_data_lifecycle
        - vane_list_lifecycle_reviews
        - vane_save_asset
        - vane_list_assets
        - vane_list_evidence
        - vane_save_finding
        - vane_list_findings
        - vane_list_projects
        - vane_arbitrate_claims
        - vane_create_decision
        - vane_get_decision
        - vane_get_decision_relationships
        - vane_evaluate_knowledge_reuse
        - vane_list_decisions
        - vane_transition_decision
        - vane_create_project
        - vane_create_mission
        - vane_get_mission
        - vane_list_missions
        - vane_submit_mission
        - vane_authorize_mission
        - vane_start_mission
        - vane_attach_evidence
        - vane_add_blocker
        - vane_clear_blocker
        - vane_request_evidence_review
        - vane_complete_mission
        - vane_close_mission
      resources: false
      prompts: false
