name: VANE Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev,mcp,crypto]"
      - name: Compile package
        run: python -m compileall -q vane
      - name: Lint Python sources
        run: python -m ruff check vane tests
      - name: Run tests
        run: python -m pytest
      - name: Check CLI
        run: |
          vane version
          vane check --config config/vane.example.json
