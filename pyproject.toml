[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vane-agent"
version = "0.2.0"
description = "Policy-governed Web2/Web3 assessment engine for the Hermes Agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VANE Project" }]
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.22"]
mcp = ["mcp>=1.9.0,<2.0.0"]
crypto = ["cryptography>=42.0"]

[project.scripts]
vane = "vane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vane"]
